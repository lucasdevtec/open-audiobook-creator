[package]
name = "oac-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tauri v2 Desktop Application for Open Audiobook Creator"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
oac-core = { path = "../oac-core" }
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4"] }

